<style>
/* Écran unique d'iPhone : grand chiffre du mois en tête, liste dessous, barre fixe à trois onglets. */
:root{--bg:#edf3f0;--surface:#fff;--line:#d3dfda;--ink:#14302a;--muted:#566b65;--accent:#14594f;--on-accent:#fff;--soft:#dcebe6;--warn-bg:#fdf1dc;--warn:#854d0e;--danger:#b3261e;--ok:#14663f;

:root[data-theme="dark"]{--bg:#0e1917;--surface:#182624;--line:#2d403c;--ink:#e6f0ed;--muted:#a0b4af;--accent:#62cdb6;--on-accent:#06231d;--soft:#21403a;--warn-bg:#3a2c12;--warn:#f3c777;--danger:#ff9d94;--ok:#7fdca6;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{max-width:560px;margin:0 auto;display:grid;gap:16px}

.stack{display:grid;gap:12px}.stack>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}

.hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;display:grid;gap:4px}

.doc .dh>*{min-width:0}

@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>

<script>
"use strict";
/* ---------- Outils ---------- */
const $=s=>document.querySelector(s), KEY="moncabinet.v1";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const frDate=s=>{const[a,m,j]=String(s).split("-");return j+"/"+m+"/"+a};
const money=c=>{const n=Math.abs(c),e=Math.floor(n/100),t=String(e).replace(/\B(?=(\d{3})+$)/g," ");return(c<0?"-":"")+t+","+pad(n%100)+" €"};
const parseMoney=s=>{const t=String(s).replace(/[\s€]/g,"").replace(",",".");if(!/^\d+(\.\d{1,2})?$/.test(t))return null;return Math.round(parseFloat(t)*100)};
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const PAY=["Espèces","Chèque","Autre"];

/* ---------- Données ---------- */
const DEFAULTS={activite:"Rebouteux & Magnétiseur",nom:"",adresse:"",tel:"",email:"",siret:"",lieu:"",prestation:"Séance de magnétisme",mentionTva:"",mentionLibre:"",verifie:false,montantDefaut:5000,lastBackup:null,updatedAt:0};
let store={sessions:{},settings:{...DEFAULTS},dirty:{}};
let localOk=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);store={sessions:o.sessions||{},settings:{...DEFAULTS,...(o.settings||{})},dirty:o.dirty||{}}}}catch(e){localOk=false}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));localOk=true}catch(e){localOk=false}}
const live=()=>Object.values(store.sessions).filter(s=>!s.deleted);

/* ---------- Compte Claude (copie en ligne, privée) ---------- */
const cloud={col:null,state:"local",flushing:false};
const syncLabel=()=>({ok:"Copie en ligne à jour",wait:"Copie en ligne en attente",connect:"Connexion…",local:"Sur cet appareil seulement"}[cloud.state]);
function setCloud(s){cloud.state=s;const p=$("#sync");if(p){p.textContent=syncLabel();p.className="pill"+(s==="local"||s==="wait"?" warn":"")}}
async function initCloud(){
  const c=window.claude;
  if(!c||!c.use)return;
  setCloud("connect");
  try{
    const[db,user]=await Promise.all([c.use("db"),c.use("user")]);
    const uid=user&&await user.id();
    if(!db||!uid){setCloud("local");return}
    cloud.col=db.collection("data/users/"+uid);
    const t=setTimeout(()=>{if(cloud.state==="connect")setCloud("wait")},10000);
    cloud.col.onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;
        if(d.id==="reglages"){if((v.updatedAt||0)>(store.settings.updatedAt||0)){store.settings={...DEFAULTS,...v};changed=true}}
        else if(d.id.startsWith("s_")){const id=d.id.slice(2),l=store.sessions[id];if(!l||(v.updatedAt||0)>(l.updatedAt||0)){store.sessions[id]={...v};delete store.dirty[d.id];changed=true}}
      });
      if(!snap.metadata.fromCache){clearTimeout(t);
        const seen=new Set(snap.docs.map(d=>d.id));
        Object.values(store.sessions).forEach(s=>{if(!seen.has("s_"+s.id))store.dirty["s_"+s.id]=1});
        snap.docs.forEach(d=>{const v=d.data()||{};if(d.id.startsWith("s_")){const l=store.sessions[d.id.slice(2)];if(l&&(l.updatedAt||0)>(v.updatedAt||0))store.dirty[d.id]=1}});
        if(store.settings.updatedAt&&(!seen.has("reglages")||(snap.docs.find(d=>d.id==="reglages").data().updatedAt||0)<store.settings.updatedAt))store.dirty.reglages=1;
        flush();
        if(!Object.keys(store.dirty).length&&!cloud.flushing)setCloud("ok");
      }
      if(changed){persist();if(view==="accueil"||(view==="reglages"&&!document.activeElement.matches("input,textarea")))render()}
    },()=>{clearTimeout(t);setCloud("wait")});
  }catch(e){setCloud("local")}
}
async function flush(){
  if(!cloud.col||cloud.flushing)return;
  cloud.flushing=true;let failed=false;
  for(const k of Object.keys(store.dirty)){
    const body=k==="reglages"?store.settings:store.sessions[k.slice(2)];
    if(!body){delete store.dirty[k];continue}
    try{await cloud.col.doc(k).set(JSON.parse(JSON.stringify(body)));delete store.dirty[k]}catch(e){failed=true;if(e&&e.code==="quota_exceeded")toast("L'espace en ligne est plein. Faites une sauvegarde.");break}
  }
  persist();cloud.flushing=false;
  if(failed){setCloud("wait");return}
  if(Object.keys(store.dirty).length)return flush();
  setCloud("ok");
}
function saveSession(s){s.updatedAt=Date.now();store.sessions[s.id]=s;store.dirty["s_"+s.id]=1;persist();if(cloud.col){setCloud("wait");flush()}}
function saveSettings(){store.settings.updatedAt=Date.now();store.dirty.reglages=1;persist();if(cloud.col){setCloud("wait");flush()}}
addEventListener("online",flush);

/* ---------- Enregistrer un fichier ---------- */
let dl;const getDl=async()=>{if(dl===undefined){dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}return dl};
async function saveFile(filename,data,mime){
  const d=await getDl();
  if(d){try{await d.save({filename,data:new Blob([data],{type:mime})});return true}catch(e){if(e&&e.code==="declined")return false;if(e&&e.code==="rate_limited"){toast("Une demande est déjà ouverte. Répondez-y d'abord.");return false}}}
  const blob=new Blob([data],{type:mime});
  try{const f=new File([blob],filename,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);return true}catch(e){}
  toast("Ce navigateur a refusé d'enregistrer le fichier.");return false;
}

/* ---------- PDF écrit à la main, sans bibliothèque ---------- */
const HELV=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const BOLD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const WIN={"€":0x80,"‚":0x82,"„":0x84,"…":0x85,"Š":0x8a,"Œ":0x8c,"Ž":0x8e,"‘":0x91,"’":0x92,"“":0x93,"”":0x94,"•":0x95,"–":0x96,"—":0x97,"š":0x9a,"œ":0x9c,"ž":0x9e,"Ÿ":0x9f};
function pdfTxt(s){let o="";for(const ch of String(s).replace(/[  \t]/g," ")){const c=ch.codePointAt(0);let b=WIN[ch]!==undefined?WIN[ch]:(c>=32&&c<=255&&!(c>=127&&c<160)?c:63);o+=(b===40||b===41||b===92)?"\\"+String.fromCharCode(b):String.fromCharCode(b)}return o}
function width(s,size,bold){const T=bold?BOLD:HELV;let w=0;for(const ch of String(s)){if(ch==="€"){w+=556;continue}if(ch==="œ"||ch==="Œ"){w+=1000;continue}const b=ch.normalize("NFD").charCodeAt(0);w+=T[b-32]!==undefined?T[b-32]:556}return w*size/1000}
function wrap(s,size,bold,max){const out=[];String(s||"").split(/\r?\n/).forEach(par=>{let line="";par.split(/\s+/).filter(Boolean).forEach(word=>{const t=line?line+" "+word:word;if(width(t,size,bold)<=max){line=t;return}if(line)out.push(line);line=word;while(width(line,size,bold)>max&&line.length>1){let i=line.length-1;while(i>1&&width(line.slice(0,i),size,bold)>max)i--;out.push(line.slice(0,i));line=line.slice(i)}});if(line)out.push(line)});return out}
function buildPdf(m){
  const W=595.28,H=841.89,L=50,R=W-50;let c="",y=H-58;
  const col=(r,g,b)=>`${r} ${g} ${b} rg\n`,GREEN=col(.078,.349,.31),INK=col(.1,.14,.13),GREY=col(.36,.42,.4),RED=col(.7,.15,.12);
  const text=(s,x,yy,size,bold,color)=>{c+=`BT ${color||INK}/${bold?"F2":"F1"} ${size} Tf ${x.toFixed(2)} ${yy.toFixed(2)} Td (${pdfTxt(s)}) Tj ET\n`};
  const right=(s,x,yy,size,bold,color)=>text(s,x-width(s,size,bold),yy,size,bold,color);
  const rule=(yy,w,g)=>{c+=`${g?".078 .349 .31":".8 .84 .82"} RG ${w} w ${L} ${yy} m ${R} ${yy} l S\n`};
  const fill=(x,yy,w,h,r,g,b)=>{c+=`${r} ${g} ${b} rg ${x} ${yy} ${w} ${h} re f\n`};
  if(m.provisoire){fill(L,y-8,R-L,26,.99,.93,.92);text("DOCUMENT PROVISOIRE : informations à compléter, ne pas remettre au client",L+10,y,10,true,RED);y-=38}
  const topY=y,leftW=300;
  let ly=y;wrap(m.activite,17,true,leftW).forEach(t=>{text(t,L,ly,17,true,GREEN);ly-=20});
  ly-=2;
  [m.nom,...wrap(m.adresse,10,false,leftW),m.tel&&"Tél. : "+m.tel,m.email,m.siret&&"SIRET : "+m.siret].filter(Boolean).forEach(t=>{text(t,L,ly,10,false,INK);ly-=14});
  let ry=topY;right(m.type.toUpperCase(),R,ry,19,true,GREEN);ry-=22;
  right(m.numero?"N° "+m.numero:"Numéro : attribué au document définitif",R,ry,10,!!m.numero,m.numero?INK:GREY);ry-=15;
  right("Établi le "+frDate(m.emission),R,ry,10,false,INK);
  y=Math.min(ly,ry)-18;rule(y,.8);y-=24;
  text("CLIENT",L,y,9,true,GREY);y-=15;
  text(m.client||"Non renseigné",L,y,11,true,m.client?INK:GREY);y-=14;
  wrap(m.clientAdresse,10,false,R-L).forEach(t=>{text(t,L,y,10,false,INK);y-=13});
  y-=12;
  fill(L,y-7,R-L,23,.93,.96,.95);
  const qX=R-170,puX=R-85;
  text("Prestation",L+8,y,9.5,true);right("Qté",qX,y,9.5,true);right("Prix unitaire",puX,y,9.5,true);right("Montant",R-8,y,9.5,true);y-=28;
  const pl=wrap(m.prestation,11,false,qX-L-40);const y0=y;pl.forEach((t,i)=>{text(t,L+8,y0-i*14,11)});
  right("1",qX,y0,11);right(money(m.montant),puX,y0,11);right(money(m.montant),R-8,y0,11);
  y=y0-(pl.length-1)*14-14;
  text("Séance du "+frDate(m.date)+(m.lieu?" à "+m.lieu:""),L+8,y,9,false,GREY);y-=14;rule(y,.8);y-=26;
  rule(y+18,1.4,true);
  text("Total payé",L+8,y,13,true);right(money(m.montant),R-8,y,15,true,GREEN);y-=26;
  text("Réglé le "+frDate(m.date)+" par : "+m.paiement,L+8,y,10.5);y-=26;
  [m.mentionTva,m.mentionLibre].filter(Boolean).forEach(t=>{wrap(t,9.5,false,R-L).forEach(l=>{text(l,L,y,9.5,false,GREY);y-=13});y-=4});
  const objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]="<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
  objs[3]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>`;
  objs[4]=`<< /Length ${c.length} >>\nstream\n${c}endstream`;
  objs[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objs[7]=`<< /Title (${pdfTxt(m.type+(m.numero?" "+m.numero:""))}) /Producer (Mon Cabinet) >>`;
  let f="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const off=[];
  for(let i=1;i<objs.length;i++){off[i]=f.length;f+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
  const xr=f.length;f+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++)f+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  f+=`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xr}\n%%EOF\n`;
  const u=new Uint8Array(f.length);for(let i=0;i<f.length;i++)u[i]=f.charCodeAt(i)&255;return u;
}

/* ---------- Mentions à vérifier ---------- */
const siretOk=s=>{const d=String(s).replace(/\s/g,"");if(!/^\d{14}$/.test(d))return false;let t=0;for(let i=0;i<14;i++){let n=+d[i];if(i%2===0){n*=2;if(n>9)n-=9}t+=n}return t%10===0||d.startsWith("356000000")};
function missing(){const S=store.settings,m=[];if(!S.nom.trim())m.push("votre nom et prénom");if(!S.adresse.trim())m.push("votre adresse professionnelle");if(!S.siret.trim())m.push("votre numéro SIRET");else if(!siretOk(S.siret))m.push("un SIRET valide (14 chiffres : celui saisi semble inexact)");if(!S.lieu.trim())m.push("le lieu des séances");if(!S.verifie)m.push("la case « J'ai vérifié mes mentions »");return m}
function nextNumber(year){let max=0;Object.values(store.sessions).forEach(s=>{const n=s.doc&&s.doc.numero;if(n&&n.startsWith(year+"-"))max=Math.max(max,parseInt(n.slice(5),10)||0)});return year+"-"+String(max+1).padStart(4,"0")}

/* ---------- Écrans ---------- */
let view="accueil",cur=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})(),q="",edit=null,docFor=null,docDraft=null;
const app=$("#app");
const head=()=>`<div class="top"><h1>MON CABINET</h1><span id="sync" class="pill${cloud.state==="local"||cloud.state==="wait"?" warn":""}">${esc(syncLabel())}</span></div>`;
function rowHtml(s){const d=s.doc;return`<button class="row" data-open="${esc(s.id)}"><span class="name">${esc(s.client||"Client non renseigné")}</span><span class="amt">${money(s.amount)}</span><span class="sub">${frDate(s.date)} · ${esc(s.pay)}${d&&d.numero?" · "+esc(d.type)+" n° "+esc(d.numero):""}</span></button>`}
function backupNote(){if(!live().length)return"";const lb=store.settings.lastBackup;const days=lb?Math.floor((Date.now()-lb)/864e5):null;if(lb&&days<(cloud.state==="local"?7:30))return"";return`<div class="note"><span>${lb?`Dernière copie de sauvegarde il y a ${days} jours.`:"Vous n'avez pas encore fait de copie de sauvegarde."}</span><button class="btn" data-go="reglages">Faire une sauvegarde</button></div>`}
function renderHome(){
  const ym=cur.y+"-"+pad(cur.m+1),all=live(),inM=all.filter(s=>s.date.startsWith(ym)),inY=all.filter(s=>s.date.startsWith(cur.y+"-"));
  const sum=a=>a.reduce((t,s)=>t+s.amount,0);
  app.innerHTML=head()+`
  <div class="monthnav"><button class="iconbtn" id="mPrev" aria-label="Mois précédent">‹</button><span>${MONTHS[cur.m]} ${cur.y}</span><button class="iconbtn" id="mNext" aria-label="Mois suivant">›</button></div>
  <section class="hero"><span>Chiffre d'affaires du mois</span><span class="big">${money(sum(inM))}</span><span>${inM.length} séance${inM.length>1?"s":""} ce mois-ci</span></section>
  <section class="stats"><div class="stat"><b>${money(sum(inY))}</b><span>Année ${cur.y}</span></div><div class="stat"><b>${all.length}</b><span>Séances au total</span></div></section>
  <button class="btn primary" data-go="seance">+ Nouvelle séance</button>
  ${backupNote()}
  <label class="f"><span>Retrouver une séance</span><input id="q" type="search" placeholder="Nom, date, montant, n° de document" value="${esc(q)}" autocomplete="off"></label>
  <div id="res"></div>`;
  $("#mPrev").onclick=()=>{cur.m--;if(cur.m<0){cur.m=11;cur.y--}q="";render()};
  $("#mNext").onclick=()=>{cur.m++;if(cur.m>11){cur.m=0;cur.y++}q="";render()};
  $("#q").oninput=e=>{q=e.target.value;results()};
  results();
}
function results(){
  const t=q.trim().toLowerCase(),ym=cur.y+"-"+pad(cur.m+1);
  const base=live().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const list=t?base.filter(s=>[s.client,frDate(s.date),money(s.amount),s.pay,s.doc&&s.doc.numero].join(" ").toLowerCase().includes(t)):base.filter(s=>s.date.startsWith(ym));
  const title=t?`${list.length} résultat${list.length>1?"s":""} (tous les mois)`:`Historique de ${MONTHS[cur.m]} ${cur.y}`;
  $("#res").innerHTML=`<div class="stack"><h3>${esc(title)}</h3>${list.length?`<div class="list">${list.map(rowHtml).join("")}</div>`:`<div class="empty">${t?"Aucune séance ne correspond.":live().length?"Aucune séance ce mois-ci. Utilisez les flèches pour voir les autres mois.":"Votre première séance apparaîtra ici. Appuyez sur « Nouvelle séance ». Vous aviez déjà des séances ? Allez dans l'onglet Sauvegarde pour les restaurer."}</div>`}</div>`;
}
function renderSeance(){
  const e=edit||{date:today(),client:"",amount:store.settings.montantDefaut,pay:"Espèces"};
  app.innerHTML=head()+`<h2>${edit?"Modifier la séance":"Nouvelle séance"}</h2>
  <form id="f" class="stack" novalidate>
  <label class="f">Date<input id="fDate" type="date" value="${esc(e.date)}" required></label>
  <label class="f"><span>Nom du client <small>(facultatif)</small></span><input id="fClient" type="text" value="${esc(e.client)}" autocomplete="off" autocapitalize="words"></label>
  <label class="f">Montant encaissé (€)<input id="fAmount" class="amount" type="text" inputmode="decimal" value="${(e.amount/100).toFixed(e.amount%100?2:0).replace(".",",")}"></label>
  <div class="f" style="display:grid;gap:6px;font-weight:600;font-size:15px"><span>Moyen de paiement</span><div class="seg" id="fPay">${PAY.map(p=>`<button type="button" data-p="${p}" aria-pressed="${p===e.pay}">${p}</button>`).join("")}</div></div>
  ${edit&&edit.doc?`<div class="info">Un document existe déjà pour cette séance. Après une modification, recréez son PDF : il gardera le même numéro.</div>`:""}
  <p id="fErr" class="small" style="color:var(--danger)" hidden></p>
  <button class="btn primary" type="submit">${edit?"Enregistrer les modifications":"Enregistrer la séance"}</button>
  ${edit?`<button class="btn" type="button" id="fCancel">Annuler</button>`:""}
  </form>`;
  let pay=e.pay;
  $("#fPay").onclick=ev=>{const b=ev.target.closest("[data-p]");if(!b)return;pay=b.dataset.p;$("#fPay").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  if(edit)$("#fCancel").onclick=()=>{edit=null;go("accueil")};
  $("#f").onsubmit=ev=>{ev.preventDefault();
    const date=$("#fDate").value,amt=parseMoney($("#fAmount").value),err=$("#fErr");
    if(!date){err.hidden=false;err.textContent="Choisissez une date.";return}
    if(amt===null){err.hidden=false;err.textContent="Le montant doit être un nombre, par exemple 50 ou 45,50.";return}
    const s=edit?{...edit}:{id:newId(),createdAt:Date.now()};
    Object.assign(s,{date,client:$("#fClient").value.trim(),amount:amt,pay});
    const was=!!edit;saveSession(s);edit=null;
    const[y,m]=date.split("-");cur={y:+y,m:+m-1};q="";go("accueil");
    toast(was?"Séance modifiée.":"Séance enregistrée.");
  };
}
function renderDoc(){
  const s=store.sessions[docFor],S=store.settings,miss=missing(),old=s.doc||{};
  if(!docDraft)docDraft={type:old.type||"Note",client:s.client,clientAdresse:old.clientAdresse||"",prestation:old.prestation||S.prestation};
  const d=docDraft;
  app.innerHTML=head()+`<h2>Document pour le client</h2>
  ${miss.length?`<div class="note"><b>Ce PDF sera marqué « provisoire », sans numéro.</b><span>Pour un document définitif, il manque :</span><ul>${miss.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="btn" data-go="reglages">Compléter mes informations</button></div>`:""}
  <div class="stack">
  <div class="seg" id="dType">${["Note","Facture"].map(t=>`<button type="button" data-t="${t}" aria-pressed="${d.type===t}">${t}</button>`).join("")}</div>
  <label class="f">Nom du client<input id="dClient" value="${esc(d.client)}" autocomplete="off"></label>
  <label class="f"><span>Adresse du client <small>(facultatif)</small></span><textarea id="dAdr">${esc(d.clientAdresse)}</textarea></label>
  <label class="f">Prestation<input id="dPrest" value="${esc(d.prestation)}"></label>
  </div>
  <div class="doc" id="preview"></div>
  <button class="btn primary" id="dMake">Créer et enregistrer le PDF</button>
  <button class="btn" id="dBack">Retour</button>`;
  const prev=()=>{const n=old.numero||(miss.length?"":nextNumber(today().slice(0,4)));
    $("#preview").innerHTML=`${miss.length?`<div class="prov">DOCUMENT PROVISOIRE</div>`:""}<div class="dh"><div><h4>${esc(S.activite)}</h4>${[S.nom,S.adresse,S.tel,S.email,S.siret&&"SIRET : "+S.siret].filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join("")}</div><div style="text-align:right"><b>${esc(d.type.toUpperCase())}</b><div>${n?"N° "+esc(n):""}</div></div></div><div><b>Client :</b> ${esc(d.client||"Non renseigné")}</div><div>${esc(d.prestation)}<br>Séance du ${frDate(s.date)}${S.lieu?" à "+esc(S.lieu):""}</div><div class="tot"><span>Total payé</span><span>${money(s.amount)}</span></div><div>Réglé par : ${esc(s.pay)}</div>${S.mentionTva?`<div>${esc(S.mentionTva)}</div>`:""}`};
  prev();
  $("#dType").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;d.type=b.dataset.t;$("#dType").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));prev()};
  [["#dClient","client"],["#dAdr","clientAdresse"],["#dPrest","prestation"]].forEach(([i,k])=>$(i).oninput=e=>{d[k]=e.target.value;prev()});
  $("#dBack").onclick=()=>{docFor=null;docDraft=null;go("accueil")};
  $("#dMake").onclick=()=>makePdf(s,d,miss.length>0);
}
async function makePdf(s,d,prov){
  const S=store.settings,prevDoc=s.doc||{};
  const numero=prevDoc.numero||(prov?"":nextNumber(today().slice(0,4)));
  const emission=prevDoc.emission||today();
  const bytes=buildPdf({provisoire:prov,activite:S.activite,nom:S.nom,adresse:S.adresse,tel:S.tel,email:S.email,siret:S.siret,lieu:S.lieu,mentionTva:S.mentionTva,mentionLibre:S.mentionLibre,type:d.type,numero,emission,client:d.client.trim(),clientAdresse:d.clientAdresse,prestation:d.prestation,date:s.date,montant:s.amount,paiement:s.pay});
  if(!prov){const n={...s,client:d.client.trim(),doc:{type:d.type,numero,emission,clientAdresse:d.clientAdresse,prestation:d.prestation}};saveSession(n)}
  const safe=(d.client||"client").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"client";
  const name=`${prov?"PROVISOIRE-":""}${d.type}-${numero||s.date}-${safe}.pdf`;
  const ok=await saveFile(name,bytes,"application/pdf");
  if(ok)modal(`<h3>PDF prêt</h3><p class="small">Fichier : ${esc(name)}</p><div class="info"><b>Pour l'envoyer par e-mail au client :</b><span>si le menu de partage ne s'est pas ouvert, retrouvez le PDF dans les téléchargements de Brave ou dans l'app Fichiers, puis choisissez Partager et Mail.</span></div><button class="btn primary" data-close data-go="accueil">Terminé</button>`);
}
function renderReglages(){
  const S=store.settings,miss=missing();
  const where=cloud.state==="local"
    ?`<b>Vos données sont uniquement sur cet appareil, dans ce navigateur.</b> Aucune copie en ligne n'est active. Si Brave efface ses données ou si le téléphone change, seul votre fichier de sauvegarde permettra de tout récupérer.`
    :`<b>Vos données sont à deux endroits :</b> dans Brave sur ce téléphone, et dans une copie privée liée à votre compte Claude, envoyée dès que la connexion le permet. Cette copie dépend de votre compte et de cette page : gardez aussi un fichier de sauvegarde.`;
  const lb=S.lastBackup?new Date(S.lastBackup).toLocaleDateString("fr-FR"):"jamais";
  app.innerHTML=head()+`<h2>Sauvegarde</h2>
  <div class="info"><span>${where}</span><span>État actuel : ${esc(syncLabel())}.</span>${localOk?"":"<b>Attention : ce navigateur refuse l'enregistrement local. Vérifiez que vous n'êtes pas en navigation privée.</b>"}</div>
  <div class="stack"><p>Dernier fichier de sauvegarde : <b>${esc(lb)}</b>. Le fichier n'est pas créé automatiquement : faites-le chaque semaine et rangez-le dans iCloud Drive.</p>
  <button class="btn primary" id="bSave">Enregistrer une sauvegarde</button>
  <label class="file">Restaurer depuis un fichier<input id="bFile" type="file" accept=".json,application/json,text/plain"></label>
  <details><summary>Si l'enregistrement du fichier ne marche pas</summary><div class="stack"><p class="small muted">Copiez vos données et collez-les dans une note. Pour les remettre, collez le texte ci-dessous.</p><button class="btn" id="bCopy">Copier mes données</button><textarea id="bText" aria-label="Texte de sauvegarde à coller"></textarea><button class="btn" id="bPaste">Restaurer ce texte</button></div></details></div>
  <h2 id="infos">Mes informations</h2>
  ${miss.length?`<div class="note"><b>À compléter avant les documents définitifs :</b><ul>${miss.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div class="info">Vos documents seront numérotés et définitifs.</div>`}
  <form id="s" class="stack">
  ${[["activite","Activité"],["nom","Nom et prénom","Ex. : Prénom NOM, avec « EI » si cela vous concerne"],["tel","Téléphone"],["email","E-mail"],["siret","Numéro SIRET","14 chiffres"],["lieu","Lieu des séances","Ville ou adresse où vous exercez"],["prestation","Prestation par défaut"]].map(([k,l,h])=>`<label class="f"><span>${l}${h?` <small>${esc(h)}</small>`:""}</span><input id="s_${k}" value="${esc(S[k])}" ${k==="tel"?'type="tel"':k==="email"?'type="email"':k==="siret"?'inputmode="numeric"':""}></label>`).join("")}
  <label class="f">Adresse professionnelle<textarea id="s_adresse">${esc(S.adresse)}</textarea></label>
  <label class="f">Montant proposé par défaut (€)<input id="s_montant" inputmode="decimal" value="${(S.montantDefaut/100).toFixed(S.montantDefaut%100?2:0).replace(".",",")}"></label>
  <label class="f"><span>Mention TVA <small>Vide par défaut. À écrire seulement après avoir confirmé votre situation.</small></span><textarea id="s_mentionTva">${esc(S.mentionTva)}</textarea></label>
  <label class="f"><span>Autre mention <small>(facultatif)</small></span><textarea id="s_mentionLibre">${esc(S.mentionLibre)}</textarea></label>
  <label class="check"><input id="s_verifie" type="checkbox" ${S.verifie?"checked":""}><span>J'ai vérifié mes mentions auprès d'une source fiable (URSSAF, service des impôts ou comptable).</span></label>
  <button class="btn primary" type="submit">Enregistrer mes informations</button>
  </form>`;
  $("#bSave").onclick=async()=>{const name=`MonCabinet-sauvegarde-${today()}.json`;const ok=await saveFile(name,backupJson(),"application/json");if(ok){store.settings.lastBackup=Date.now();saveSettings();render();toast("Sauvegarde enregistrée.")}};
  $("#bCopy").onclick=async()=>{const t=$("#bText");t.value=backupJson();try{await navigator.clipboard.writeText(t.value);toast("Données copiées. Collez-les dans une note.")}catch(e){t.focus();t.select();toast("Sélectionnez le texte puis copiez-le.")}};
  $("#bPaste").onclick=()=>askRestore($("#bText").value);
  $("#bFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>askRestore(String(r.result));r.onerror=()=>toast("Impossible de lire ce fichier.");r.readAsText(f);e.target.value=""};
  $("#s").onsubmit=e=>{e.preventDefault();
    const a=parseMoney($("#s_montant").value);if(a===null){toast("Le montant par défaut doit être un nombre.");return}
    ["activite","nom","tel","email","siret","lieu","prestation","adresse","mentionTva","mentionLibre"].forEach(k=>S[k]=$("#s_"+k).value.trim());
    S.montantDefaut=a;S.verifie=$("#s_verifie").checked;saveSettings();render();scrollTo(0,0);toast("Informations enregistrées.")};
}
const backupJson=()=>JSON.stringify({app:"MonCabinet",version:1,exportedAt:new Date().toISOString(),sessions:Object.values(store.sessions),settings:store.settings},null,1);
function askRestore(txt){
  let o;try{o=JSON.parse(txt);if(o.app!=="MonCabinet"||!Array.isArray(o.sessions))throw 0;if(!o.sessions.every(s=>s&&typeof s.id==="string"&&typeof s.date==="string"&&Number.isFinite(s.amount)))throw 0}catch(e){toast("Ce fichier n'est pas une sauvegarde de Mon Cabinet.");return}
  const n=o.sessions.filter(s=>!s.deleted).length;
  modal(`<h3>Restaurer cette sauvegarde ?</h3><p>Elle contient ${n} séance${n>1?"s":""}. Elle s'ajoute à vos séances actuelles. Pour une même séance, c'est la version la plus récente qui est gardée.</p><button class="btn primary" id="rOk">Restaurer</button><button class="btn" data-close>Annuler</button>`);
  $("#rOk").onclick=()=>{let added=0;o.sessions.forEach(s=>{const l=store.sessions[s.id];if(!l||(s.updatedAt||0)>(l.updatedAt||0)){store.sessions[s.id]=s;store.dirty["s_"+s.id]=1;added++}});
    if(o.settings&&(o.settings.updatedAt||0)>(store.settings.updatedAt||0)){store.settings={...DEFAULTS,...o.settings};store.dirty.reglages=1}
    persist();flush();closeModal();go("accueil");toast(`${added} séance${added>1?"s":""} restaurée${added>1?"s":""}.`)};
}
function openSession(id){
  const s=store.sessions[id];if(!s)return;
  modal(`<h3>${esc(s.client||"Client non renseigné")}</h3><p>${frDate(s.date)} · <b>${money(s.amount)}</b> · ${esc(s.pay)}${s.doc&&s.doc.numero?`<br>${esc(s.doc.type)} n° ${esc(s.doc.numero)}`:""}</p>
  <button class="btn primary" id="oDoc">Créer un PDF pour le client</button><button class="btn" id="oEdit">Modifier</button><button class="btn danger" id="oDel">Supprimer</button><button class="btn" data-close>Fermer</button>`);
  $("#oDoc").onclick=()=>{closeModal();docFor=id;docDraft=null;go("document")};
  $("#oEdit").onclick=()=>{closeModal();edit={...s};go("seance")};
  $("#oDel").onclick=()=>{
    modal(`<h3>Supprimer cette séance ?</h3><p>${frDate(s.date)}, ${money(s.amount)}.${s.doc&&s.doc.numero?` Le numéro ${esc(s.doc.numero)} ne sera pas réutilisé.`:""}</p><button class="btn danger" id="oYes">Oui, supprimer</button><button class="btn" data-close>Annuler</button>`);
    $("#oYes").onclick=()=>{saveSession({...s,deleted:true});closeModal();render();toast("Séance supprimée.")};
  };
}
function modal(h){$("#sheet").innerHTML=h;$("#modal").hidden=false}
function closeModal(){$("#modal").hidden=true;$("#sheet").innerHTML=""}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
function go(v){closeModal();if(v!=="seance")edit=null;view=v;render();scrollTo(0,0)}
function render(){({accueil:renderHome,seance:renderSeance,document:renderDoc,reglages:renderReglages}[view])();
  const tab=view==="document"?"accueil":view;document.querySelectorAll("nav button").forEach(b=>{b.dataset.go===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")})}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const o=e.target.closest("[data-open]");if(o){openSession(o.dataset.open);return}
  if(e.target.closest("[data-close]")||e.target.id==="modal")closeModal();
});
load();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
initCloud();
